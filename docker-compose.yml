version: '3.8'

services:
  unifi-health-check:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unifi-health-check
    restart: unless-stopped
    ports:
      # Exposes the service on a unique and configurable host port.
      # By default, it maps to port 2943 on the host, preventing conflicts.
      - "${HOST_PORT:-2943}:3445"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3445
