version: '3.8'

services:
  unifi-health-check:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unifi-health-check
    restart: unless-stopped
    user: "node"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 150
    ports:
      # Exposes the service on a unique and configurable host port.
      # By default, it maps to port 3843 on the host, preventing conflicts.
      - "${HOST_PORT:-3843}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # Re-routing Express to listen to 3000 internally inside the container
      - PORT=3000
